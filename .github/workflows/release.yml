name: Release
on:
  push:
    branches:
      - release-*
  workflow_dispatch:

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_version:
    if: github.repository == 'Dam-99/mihon'
    name: Validate ref and extract version
    runs-on: 'ubuntu-24.04'
    outputs:
      version: ${{ steps.extract.outputs.version }}

    steps:
      - name: Validate ref and extract version
        id: extract
        run: |
          set -e

          if [[ "${GITHUB_REF}" =~ ^refs/heads/release-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${GITHUB_REF#refs/heads/release-}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected ref ${GITHUB_REF}, expected refs/heads/release-<semver>"
            exit 1
          fi

  build:
    if: github.repository == 'Dam-99/mihon'
    name: Build
    runs-on: 'ubuntu-24.04'
    needs: get_version
    env:
      VERSION: ${{ needs.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew assembleRelease -Pinclude-telemetry -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk "mihon-v${VERSION}-dam.apk"
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk "mihon-arm64-v8a-v${VERSION}-dam.apk"
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk "mihon-armeabi-v7a-v${VERSION}-dam.apk"
          mv app/build/outputs/apk/release/app-x86-release.apk "mihon-x86-v${VERSION}-dam.apk"
          mv app/build/outputs/apk/release/app-x86_64-release.apk "mihon-x86_64-v${VERSION}-dam.apk"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mihon
          path: |
            mihon-v${{ env.VERSION }}-dam.apk
            mihon-arm64-v8a-v${{ env.VERSION }}-dam.apk
            mihon-armeabi-v7a-v${{ env.VERSION }}-dam.apk
            mihon-x86-v${{ env.VERSION }}-dam.apk
            mihon-x86_64-v${{ env.VERSION }}-dam.apk

  build_foss:
    if: github.repository == 'Dam-99/mihon'
    name: Build (FOSS)
    runs-on: ubuntu-24.04
    needs: get_version
    env:
      VERSION: ${{ needs.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Build
        run: ./gradlew assembleFoss -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/foss/app-universal-foss.apk "mihon-v${VERSION}-dam-foss.apk"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mihon-foss
          path: mihon-v${{ env.VERSION }}-dam-foss.apk

  release:
    if: github.repository == 'Dam-99/mihon'
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [get_version, build, build_foss]
    env:
      VERSION: ${{ needs.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            mihon
            mihon-foss

      - name: Extract changelog
        run: |
          set -euo pipefail

          section="## [v${VERSION}]"

          awk -v sec="${section}" '
            index($0, sec) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -E \
            -e 's| *\(\[#[0-9]+\]\([^)]+\)\)||g' \
            -e 's|\[@([A-Za-z0-9_-]+)\]\([^)]+\)|@\1|g' \
            -e 's/^### Added$/### ✨ New Features/' \
            -e 's/^### Changed$/### ⚙️ Changes/' \
            -e 's/^### Improved$/### 🚀 Improvements/' \
            -e 's/^### Fixed$/### 🧩 Fixes/' \
            -e 's/^### Removed$/### 🗑️ Removed/' \
            -e 's/^### Other$/### 🔧 Other/' \
            > changelog.md

          if [ ! -s changelog.md ]; then
            echo "Section ${section} not found, falling back to Unreleased"
            awk '
              index($0, "## [Unreleased]") == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md | sed -E \
              -e 's| *\(\[#[0-9]+\]\([^)]+\)\)||g' \
              -e 's|\[@([A-Za-z0-9_-]+)\]\([^)]+\)|@\1|g' \
              -e 's/^### Added$/### ✨ New Features/' \
              -e 's/^### Changed$/### ⚙️ Changes/' \
              -e 's/^### Improved$/### 🚀 Improvements/' \
              -e 's/^### Fixed$/### 🧩 Fixes/' \
              -e 's/^### Removed$/### 🗑️ Removed/' \
              -e 's/^### Other$/### 🔧 Other/' \
              > changelog.md
          fi

          if [ ! -s changelog.md ]; then
            echo "::warning::No changelog section found for ${VERSION}"
            echo "_No changelog available._" > changelog.md
          fi

      - name: Assemble release body
        run: |
          set -euo pipefail

          {
            cat <<'EOF'
          Fork build of [mihonapp/mihon](https://github.com/mihonapp/mihon) with a little feature applied on top.

          Check out the [upstream release](https://github.com/mihonapp/mihon/releases/tag/v<version>) for the official builds.

          ## Changelog

          ### 🔥 Custom feature
          - Switch between different app branding: the current ***Mihon***, or the previous ***Tachiyomi*** (@Dam-99)

          EOF
            cat changelog.md
          } | sed -E  \
           "s|<version>|${VERSION}|" > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.get_version.outputs.version }}-dam
          target_commitish: ${{ github.sha }}
          name: Mihon v${{ needs.get_version.outputs.version }}-dam
          body_path: release-body.md
          files: |
            mihon-v${{ needs.get_version.outputs.version }}-dam.apk
            mihon-v${{ needs.get_version.outputs.version }}-dam-foss.apk
            mihon-arm64-v8a-v${{ needs.get_version.outputs.version }}-dam.apk
            mihon-armeabi-v7a-v${{ needs.get_version.outputs.version }}-dam.apk
            mihon-x86-v${{ needs.get_version.outputs.version }}-dam.apk
            mihon-x86_64-v${{ needs.get_version.outputs.version }}-dam.apk
          draft: false
          prerelease: false
          token: ${{ secrets.MIHON_PAT }}
